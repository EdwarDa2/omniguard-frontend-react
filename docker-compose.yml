services:
  omniguard-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: omniguard-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
      - CHOKIDAR_USEPOLLING=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
